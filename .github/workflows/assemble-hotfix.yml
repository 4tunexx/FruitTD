name: assemble-hotfix
on:
  push:
    branches: [cursor/fix-boot-require-esm]
    paths: ['hotfix-parts/**']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble sources from base64 parts
        run: |
          set -euo pipefail
          if ls hotfix-parts/main.b64.* >/dev/null 2>&1; then
            cat hotfix-parts/main.b64.* | base64 -d > src/main.ts
          fi
          if ls hotfix-parts/hud.b64.* >/dev/null 2>&1; then
            cat hotfix-parts/hud.b64.* | base64 -d > src/ui/hud.ts
          fi
          rm -rf hotfix-parts .github/workflows/assemble-hotfix.yml
          git config user.name "4tunexx"
          git config user.email "airijuz@gmail.com"
          git add -A
          git diff --cached --quiet || git commit -m "fix: dismiss boot loader early; replace require() in Hud with ESM"
          git push
