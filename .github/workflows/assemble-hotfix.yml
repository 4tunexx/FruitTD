name: assemble-hotfix
on:
  push:
    branches: [cursor/fix-boot-require-esm]
    paths: ['hotfix-parts/**']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble sources
        run: |
          set -euo pipefail
          if ls hotfix-parts/main.part* >/dev/null 2>&1; then
            cat hotfix-parts/main.part0 hotfix-parts/main.part1 hotfix-parts/main.part2 > src/main.ts
          fi
          if ls hotfix-parts/hud.part* >/dev/null 2>&1; then
            cat hotfix-parts/hud.part0 hotfix-parts/hud.part1 hotfix-parts/hud.part2 hotfix-parts/hud.part3 hotfix-parts/hud.part4 hotfix-parts/hud.part5 > src/ui/hud.ts
          fi
          rm -rf hotfix-parts .github/workflows/assemble-hotfix.yml
          git config user.name "4tunexx"
          git config user.email "airijuz@gmail.com"
          git add -A
          git diff --cached --quiet || git commit -m "fix: dismiss boot loader early; replace require() in Hud with ESM"
          git push
