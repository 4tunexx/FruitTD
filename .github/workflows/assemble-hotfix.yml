name: assemble-hotfix
on:
  push:
    branches: [cursor/fix-boot-require-esm]
    paths: ['hotfix-parts/READY']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble sources from base64 parts
        run: |
          set -euo pipefail
          test -f hotfix-parts/READY
          cat hotfix-parts/main.b64.* | base64 -d > src/main.ts
          cat hotfix-parts/hud.b64.* | base64 -d > src/ui/hud.ts
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          main=Path('src/main.ts').read_bytes()
          hud=Path('src/ui/hud.ts').read_bytes()
          print('main', len(main), hashlib.sha256(main).hexdigest())
          print('hud', len(hud), hashlib.sha256(hud).hexdigest())
          assert b"requestAnimationFrame(() => hideBootLoader())" in main
          assert b"require(" not in hud or b"getAvailableHeroPerkPoints" in hud
          PY
          rm -rf hotfix-parts .github/workflows/assemble-hotfix.yml
          git config user.name "4tunexx"
          git config user.email "airijuz@gmail.com"
          git add -A
          git commit -m "fix: dismiss boot loader early; replace require() in Hud with ESM"
          git push
